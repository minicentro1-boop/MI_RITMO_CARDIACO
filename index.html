<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Ritmo Cardíaco</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }
        video {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ff4757;
            margin-bottom: 20px;
            display: none; /* Oculto por defecto o para depuración */
        }
        canvas {
            display: none;
        }
        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: background 0.3s;
        }
        .btn:disabled {
            background-color: #555;
            box-shadow: none;
        }
        #bpm-display {
            font-size: 3rem;
            font-weight: bold;
            color: #ff4757;
            margin: 20px 0 5px 0;
        }
        #status {
            font-size: 0.9rem;
            color: #aaa;
            text-align: center;
            margin-bottom: 20px;
        }
        .heart-icon {
            font-size: 2rem;
            opacity: 0.3;
            transition: transform 0.1s, opacity 0.1s;
        }
        .heart-active {
            opacity: 1;
            transform: scale(1.3);
        }
    </style>
</head>
<body>

    <div id="container">
        <h1>Ritmo Cardíaco</h1>
        
        <div id="heart" class="heart-icon">❤️</div>
        <div id="bpm-display">-- <span style="font-size:1.2rem">BPM</span></div>
        <p id="status">Presiona iniciar y cubre la cámara y el flash con tu dedo suavemente.</p>

        <button id="startBtn" class="btn">Iniciar Medición</button>

        <video id="webcam" playsinline></video>
        <canvas id="canvas" width="50" height="50"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const startBtn = document.getElementById('startBtn');
        const bpmDisplay = document.getElementById('bpm-display');
        const statusText = document.getElementById('status');
        const heartIcon = document.getElementById('heart');

        let audioCtx = null;
        let isProcessing = false;
        let lastRedValue = 0;
        let lastBeatTime = 0;
        let frameHistory = [];
        const historySize = 30; // Ventana para promedio móvil

        // Crear sonido de "latido" tipo "beep"
        function playBeep() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime); // Frecuencia del beep
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);

            // Efecto visual de latido
            heartIcon.classList.add('heart-active');
            setTimeout(() => heartIcon.classList.remove('heart-active'), 100);
        }

        async function startCamera() {
            try {
                // Activar audio
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                // Solicitar cámara trasera con flash (torch)
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { exact: 'environment' },
                        width: { ideal: 300 },
                        height: { ideal: 300 },
                        advanced: [{ torch: true }] // Intenta encender la linterna
                    }
                });

                video.srcObject = stream;
                await video.play();

                // Verificar si se pudo activar el flash
                const track = stream.getVideoTracks()[0];
                const capabilities = track.getCapabilities ? track.getCapabilities() : {};
                
                if (capabilities.torch) {
                    await track.applyConstraints({ advanced: [{ torch: true }] });
                } else {
                    statusText.innerText = "Nota: Si la linterna no se enciende automáticamente, acerca tu dedo a una fuente de luz brillante.";
                }

                isProcessing = true;
                startBtn.disabled = true;
                startBtn.innerText = "Midiendo...";
                requestAnimationFrame(processFrame);

            } catch (err) {
                console.error(err);
                alert("No se pudo acceder a la cámara o linterna: " + err.message);
                statusText.innerText = "Error al abrir la cámara. Asegúrate de dar los permisos e ingresar por HTTPS.";
            }
        }

        function processFrame() {
            if (!isProcessing) return;

            // Dibujar el frame actual en el canvas reducido
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

            // Calcular el promedio del canal Rojo (R)
            let totalRed = 0;
            for (let i = 0; i < frameData.length; i += 4) {
                totalRed += frameData[i]; // Canal R
            }
            const avgRed = totalRed / (frameData.length / 4);

            // Filtro para detectar picos (latido)
            frameHistory.push(avgRed);
            if (frameHistory.length > historySize) frameHistory.shift();

            const historyAvg = frameHistory.reduce((a, b) => a + b, 0) / frameHistory.length;
            const now = performance.now();

            // Detección simple de pico: la intensidad del rojo supera el promedio local
            if (avgRed > historyAvg + 1.2 && (now - lastBeatTime) > 400) { // Mínimo 400ms entre latidos (max 150 BPM)
                playBeep();
                
                if (lastBeatTime > 0) {
                    const timeDiff = (now - lastBeatTime) / 1000; // segundos
                    const bpm = Math.round(60 / timeDiff);
                    if (bpm >= 45 && bpm <= 180) {
                        bpmDisplay.innerHTML = `${bpm} <span style="font-size:1.2rem">BPM</span>`;
                    }
                }
                lastBeatTime = now;
            }

            requestAnimationFrame(processFrame);
        }

        startBtn.addEventListener('click', startCamera);
    </script>
</body>
</html>
